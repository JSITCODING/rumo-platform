<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="800" viewBox="0 0 360 800" role="img" aria-label="S03 Onboarding Mobile v0.2"><title>S03 Onboarding Mobile v0.2</title><desc>Rumo editorial documental v0.2</desc><rect x="0" y="0" width="360" height="800" rx="0" fill="#FFFDFC" stroke="none"/><g id="Rumo logo" transform="translate(20 24) scale(0.72)"><path d="M0 0 L12 7 L12 22 L0 15 Z" fill="#AD5132"/><path d="M0 0 L12 7 L24 0 L12 -7 Z" fill="#286150"/><path d="M12 7 L24 0 L24 15 L12 22 Z" fill="#173F34"/><text x="32" y="15" font-family="Literata, Georgia, serif" font-size="22" font-weight="700" fill="#16211D">rumo</text></g><text x="340" y="38" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="400" fill="#5F6B65" text-anchor="end" letter-spacing="1">S03 · 02/05</text><line x1="20" y1="62" x2="340" y2="62" stroke="#D8D0C2" stroke-width="1"/><rect x="20" y="80" width="320" height="3" rx="0" fill="#D8D0C2" stroke="none"/><rect x="20" y="80" width="128" height="3" rx="0" fill="#AD5132" stroke="none"/><text x="20" y="117" font-family="Literata, Georgia, serif" font-size="42" font-weight="650" fill="#AD5132">02</text><text x="82" y="105" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#173F34" letter-spacing="0.8">PERCURSO ACADÉMICO</text><text x="82" y="134" font-family="Literata, Georgia, serif" font-size="27" font-weight="650" fill="#16211D">Que formação estás</text><text x="82" y="163.16" font-family="Literata, Georgia, serif" font-size="27" font-weight="650" fill="#16211D">a concluir?</text><text x="20" y="220" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Escolhe a opção mais próxima. Podes corrigir depois.</text>
  <g id="Opções"><circle cx="30" cy="276" r="8" fill="#FFFDFC" stroke="#D8D0C2"/><text x="52" y="281" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#16211D">Ensino médio geral</text><line x1="20" y1="301" x2="340" y2="301" stroke="#D8D0C2" stroke-width="1"/><circle cx="30" cy="332" r="8" fill="#FFFDFC" stroke="#173F34"/><circle cx="30" cy="332" r="4" fill="#173F34" stroke="none"/><text x="52" y="337" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#16211D">Ensino médio técnico</text><line x1="20" y1="357" x2="340" y2="357" stroke="#D8D0C2" stroke-width="1"/><circle cx="30" cy="388" r="8" fill="#FFFDFC" stroke="#D8D0C2"/><text x="52" y="393" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#16211D">Licenciatura</text><line x1="20" y1="413" x2="340" y2="413" stroke="#D8D0C2" stroke-width="1"/><circle cx="30" cy="444" r="8" fill="#FFFDFC" stroke="#D8D0C2"/><text x="52" y="449" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#16211D">Outra formação</text><line x1="20" y1="469" x2="340" y2="469" stroke="#D8D0C2" stroke-width="1"/><circle cx="30" cy="500" r="8" fill="#FFFDFC" stroke="#D8D0C2"/><text x="52" y="505" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#16211D">Ainda não sei</text><line x1="20" y1="525" x2="340" y2="525" stroke="#D8D0C2" stroke-width="1"/></g><g id="Nota Rumo"><rect x="20" y="576" width="320" height="8" rx="0" fill="#895F20" stroke="none"/><text x="20" y="603" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#895F20" letter-spacing="0.8">NOTA RUMO</text><text x="20" y="623" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">“Ainda não sei” é uma resposta válida. A análise</text><text x="20" y="638.84" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">indicará o que precisa de confirmação.</text></g><text x="20" y="710" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#173F34">Voltar</text><g id="Acção Continuar"><rect x="158" y="684" width="182" height="48" rx="4" fill="#173F34" stroke="none"/><text x="249" y="714" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Continuar</text></g></svg>