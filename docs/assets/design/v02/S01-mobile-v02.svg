<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="800" viewBox="0 0 360 800" role="img" aria-label="S01 Landing Mobile v0.2"><title>S01 Landing Mobile v0.2</title><desc>Rumo editorial documental v0.2</desc><rect x="0" y="0" width="360" height="800" rx="0" fill="#FFFDFC" stroke="none"/><g id="Rumo logo" transform="translate(20 24) scale(0.72)"><path d="M0 0 L12 7 L12 22 L0 15 Z" fill="#AD5132"/><path d="M0 0 L12 7 L24 0 L12 -7 Z" fill="#286150"/><path d="M12 7 L24 0 L24 15 L12 22 Z" fill="#173F34"/><text x="32" y="15" font-family="Literata, Georgia, serif" font-size="22" font-weight="700" fill="#16211D">rumo</text></g><text x="340" y="38" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="400" fill="#5F6B65" text-anchor="end" letter-spacing="1">S01 · ENTRAR</text><line x1="20" y1="62" x2="340" y2="62" stroke="#D8D0C2" stroke-width="1"/>
  <g id="Introdução"><text x="20" y="102" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#AD5132" letter-spacing="0.8">UM GUIA, NÃO UM ATALHO</text><text x="20" y="148" font-family="Literata, Georgia, serif" font-size="38" font-weight="650" fill="#16211D">Estudar fora começa</text><text x="20" y="187.52" font-family="Literata, Georgia, serif" font-size="38" font-weight="650" fill="#16211D">por perceber o teu</text><text x="20" y="227.04000000000002" font-family="Literata, Georgia, serif" font-size="38" font-weight="650" fill="#16211D">ponto de partida.</text><text x="22" y="283" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6B65">O Rumo ajuda-te a descobrir opções, comparar</text><text x="22" y="303.3" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6B65">requisitos e organizar cada candidatura.</text></g>
