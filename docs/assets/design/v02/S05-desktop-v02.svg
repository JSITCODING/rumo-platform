<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="S05 Dashboard Desktop v0.2"><title>S05 Dashboard Desktop v0.2</title><desc>Rumo editorial documental v0.2</desc><rect x="0" y="0" width="1440" height="900" rx="0" fill="#FFFDFC" stroke="none"/><rect x="0" y="0" width="1440" height="900" rx="0" fill="#FFFDFC" stroke="none"/><g id="Barra superior"><g id="Rumo logo" transform="translate(72 38) scale(0.8)"><path d="M0 0 L12 7 L12 22 L0 15 Z" fill="#AD5132"/><path d="M0 0 L12 7 L24 0 L12 -7 Z" fill="#286150"/><path d="M12 7 L24 0 L24 15 L12 22 Z" fill="#173F34"/><text x="32" y="15" font-family="Literata, Georgia, serif" font-size="22" font-weight="700" fill="#16211D">rumo</text></g><text x="892" y="52" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#173F34">Início</text><text x="1020" y="52" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">Descobrir</text><text x="1148" y="52" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">Plano</text><text x="1368" y="52" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#16211D" text-anchor="end">Ana M.</text><line x1="72" y1="82" x2="1368" y2="82" stroke="#D8D0C2" stroke-width="1"/></g><text x="88" y="145" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6B65">Bom dia, Ana.</text><text x="88" y="214" font-family="Literata, Georgia, serif" font-size="50" font-weight="650" fill="#16211D">Um próximo passo</text><text x="88" y="266" font-family="Literata, Georgia, serif" font-size="50" font-weight="650" fill="#16211D">de cada vez.</text><g id="Próximo passo"><rect x="88" y="356" width="5" height="330" rx="0" fill="#AD5132" stroke="none"/><text x="124" y="386" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#AD5132">PRÓXIMO PASSO · 01</text><text x="124" y="452" font-family="Literata, Georgia, serif" font-size="34" font-weight="650" fill="#16211D">Encontra uma opção</text><text x="124" y="488.72" font-family="Literata, Georgia, serif" font-size="34" font-weight="650" fill="#16211D">que faça sentido</text><text x="124" y="555" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6B65">Compara requisitos e fontes antes de adicionares</text><text x="124" y="574.6" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6B65">uma oportunidade ao plano.</text><text x="124" y="635" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#173F34">Explorar oportunidades  →</text></g><text x="850" y="148" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#173F34">O TEU PLANO</text><line x1="850" y1="170" x2="1350" y2="170" stroke="#D8D0C2" stroke-width="1"/><text x="850" y="224" font-family="Literata, Georgia, serif" font-size="52" font-weight="650" fill="#16211D">0</text><text x="920" y="215" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6B65">oportunidades em curso</text><line x1="850" y1="252" x2="1350" y2="252" stroke="#D8D0C2" stroke-width="1"/><g id="Nota Rumo"><rect x="850" y="330" width="500" height="8" rx="0" fill="#895F20" stroke="none"/><text x="850" y="357" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#895F20" letter-spacing="0.8">PERFIL</text><text x="850" y="377" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Dois dados continuam por confirmar. Isto pode</text><text x="850" y="392.84" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">alterar a compatibilidade apresentada.</text></g><g id="Faixa de fonte"><rect x="850" y="520" width="500" height="42" rx="0" fill="#F7F3EA" stroke="none"/><rect x="850" y="520" width="4" height="42" rx="0" fill="#895F20" stroke="none"/><text x="864" y="537" font-family="IBM Plex Mono, monospace" font-size="9" font-weight="600" fill="#895F20" letter-spacing="0.7">FONTE E CERTEZA</text><text x="864" y="553" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F6B65">Resumo demonstrativo · actualizado agora</text></g></svg>