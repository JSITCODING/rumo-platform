<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="S04 Análise Desktop v0.2"><title>S04 Análise Desktop v0.2</title><desc>Rumo editorial documental v0.2</desc><rect x="0" y="0" width="1440" height="900" rx="0" fill="#FFFDFC" stroke="none"/><rect x="0" y="0" width="1440" height="900" rx="0" fill="#FFFDFC" stroke="none"/><g id="Barra superior"><g id="Rumo logo" transform="translate(72 38) scale(0.8)"><path d="M0 0 L12 7 L12 22 L0 15 Z" fill="#AD5132"/><path d="M0 0 L12 7 L24 0 L12 -7 Z" fill="#286150"/><path d="M12 7 L24 0 L24 15 L12 22 Z" fill="#173F34"/><text x="32" y="15" font-family="Literata, Georgia, serif" font-size="22" font-weight="700" fill="#16211D">rumo</text></g><text x="892" y="52" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#173F34">Início</text><text x="1020" y="52" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">Descobrir</text><text x="1148" y="52" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">Plano</text><text x="1368" y="52" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#16211D" text-anchor="end">Ana M.</text><line x1="72" y1="82" x2="1368" y2="82" stroke="#D8D0C2" stroke-width="1"/></g><text x="88" y="144" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#AD5132">DOSSIER DE PERFIL</text><text x="88" y="216" font-family="Literata, Georgia, serif" font-size="56" font-weight="650" fill="#16211D">O teu ponto de partida</text><text x="90" y="292" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6B65">Leitura inicial · não é uma decisão de admissão</text><line x1="88" y1="330" x2="920" y2="330" stroke="#16211D" stroke-width="2"/><text x="88" y="382" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#173F34">FORÇAS</text><text x="88" y="440" font-family="Literata, Georgia, serif" font-size="48" font-weight="650" fill="#16211D">3</text><text x="358" y="382" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#895F20">A CONFIRMAR</text><text x="358" y="440" font-family="Literata, Georgia, serif" font-size="48" font-weight="650" fill="#16211D">2</text><text x="628" y="382" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#913B35">ATENÇÃO</text><text x="628" y="440" font-family="Literata, Georgia, serif" font-size="48" font-weight="650" fill="#16211D">1</text><line x1="88" y1="474" x2="920" y2="474" stroke="#D8D0C2" stroke-width="1"/><text x="88" y="530" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#AD5132">01</text><text x="140" y="530" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#16211D">Percurso académico consistente</text><text x="140" y="557" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Notas introduzidas pelo estudante · por verificar</text><line x1="88" y1="578" x2="920" y2="578" stroke="#D8D0C2" stroke-width="1"/><text x="88" y="618" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#AD5132">02</text><text x="140" y="618" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#16211D">Financiamento precisa de detalhe</text><text x="140" y="645" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">O orçamento mensal foi indicado como estimativa.</text><line x1="88" y1="666" x2="920" y2="666" stroke="#D8D0C2" stroke-width="1"/><text x="88" y="706" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#AD5132">03</text><text x="140" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#16211D">Idioma ainda sem comprovativo</text><text x="140" y="733" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Podes descobrir opções, mas o resultado pode mudar.</text><line x1="88" y1="754" x2="920" y2="754" stroke="#D8D0C2" stroke-width="1"/><g id="Faixa de fonte"><rect x="1010" y="330" width="350" height="42" rx="0" fill="#F7F3EA" stroke="none"/><rect x="1010" y="330" width="4" height="42" rx="0" fill="#895F20" stroke="none"/><text x="1024" y="347" font-family="IBM Plex Mono, monospace" font-size="9" font-weight="600" fill="#895F20" letter-spacing="0.7">FONTE E CERTEZA</text><text x="1024" y="363" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F6B65">Análise demonstrativa · sem probabilidade de admissão</text></g><g id="Nota Rumo"><rect x="1010" y="450" width="350" height="8" rx="0" fill="#895F20" stroke="none"/><text x="1010" y="477" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#895F20" letter-spacing="0.8">COMO LER</text><text x="1010" y="497" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Compatibilidade significa que vale a pena</text><text x="1010" y="512.84" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">investigar; não significa elegibilidade final.</text></g><g id="Acção Continuar para o início"><rect x="1010" y="650" width="350" height="48" rx="4" fill="#173F34" stroke="none"/><text x="1185" y="680" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Continuar para o início</text></g></svg>