<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="S01 Landing Desktop v0.2"><title>S01 Landing Desktop v0.2</title><desc>Rumo editorial documental v0.2</desc><rect x="0" y="0" width="1440" height="900" rx="0" fill="#FFFDFC" stroke="none"/><rect x="0" y="0" width="1440" height="900" rx="0" fill="#FFFDFC" stroke="none"/><g id="Barra superior"><g id="Rumo logo" transform="translate(72 38) scale(0.8)"><path d="M0 0 L12 7 L12 22 L0 15 Z" fill="#AD5132"/><path d="M0 0 L12 7 L24 0 L12 -7 Z" fill="#286150"/><path d="M12 7 L24 0 L24 15 L12 22 Z" fill="#173F34"/><text x="32" y="15" font-family="Literata, Georgia, serif" font-size="22" font-weight="700" fill="#16211D">rumo</text></g><text x="892" y="52" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">Início</text><text x="1020" y="52" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">Descobrir</text><text x="1148" y="52" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">Plano</text><text x="1368" y="52" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#16211D" text-anchor="end">Ana M.</text><line x1="72" y1="82" x2="1368" y2="82" stroke="#D8D0C2" stroke-width="1"/></g><text x="88" y="150" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#AD5132" letter-spacing="1">UM GUIA, NÃO UM ATALHO</text><text x="88" y="220" font-family="Literata, Georgia, serif" font-size="58" font-weight="650" fill="#16211D">Estudar fora começa</text><text x="88" y="279.16" font-family="Literata, Georgia, serif" font-size="58" font-weight="650" fill="#16211D">por perceber o teu</text><text x="88" y="338.32" font-family="Literata, Georgia, serif" font-size="58" font-weight="650" fill="#16211D">ponto de partida.</text><text x="90" y="410" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6B65">Descobre opções, compara requisitos e organiza</text><text x="90" y="433.2" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#5F6B65">cada candidatura com clareza sobre as incertezas.</text><g id="Acção Criar a minha conta"><rect x="88" y="510" width="260" height="48" rx="4" fill="#173F34" stroke="none"/><text x="218" y="540" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Criar a minha conta</text></g><text x="88" y="590" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#173F34">Portugal  ·  Alemanha  ·  Espanha</text><g id="Nota Rumo"><rect x="88" y="665" width="430" height="8" rx="0" fill="#173F34" stroke="none"/><text x="88" y="692" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#173F34" letter-spacing="0.8">O QUE O RUMO NÃO FAZ</text><text x="88" y="712" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Não promete admissão, bolsa ou visto. Orienta o</text><text x="88" y="727.84" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">processo e indica o que precisa de confirmação.</text></g><g id="Fotografia documental"><defs><clipPath id="photo-d"><rect x="720" y="112" width="648" height="676" rx="4"/></clipPath></defs><image x="720" y="112" width="648" height="676" href="https://commons.wikimedia.org/wiki/Special:Redirect/file/Adult_literacy_students_%285687218318%29.jpg?width=1280" preserveAspectRatio="xMidYMid slice" clip-path="url(#photo-d)"/><rect x="720" y="732" width="648" height="56" rx="0" fill="rgba(22,33,29,.84)" stroke="none"/><text x="744" y="765" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF">Luanda · 2011 · J. Neves/USAID · domínio público</text></g></svg>