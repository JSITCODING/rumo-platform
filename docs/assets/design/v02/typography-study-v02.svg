<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Rumo Typography Study v0.2"><title>Rumo Typography Study v0.2</title><desc>Rumo editorial documental v0.2</desc><rect x="0" y="0" width="1440" height="900" rx="0" fill="#FFFDFC" stroke="none"/><text x="72" y="78" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#AD5132" letter-spacing="1">RUMO · ESTUDO TIPOGRÁFICO</text><text x="72" y="138" font-family="Literata, Georgia, serif" font-size="42" font-weight="650" fill="#16211D">A voz documental do produto</text><text x="72" y="178" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6B65">Comparação aplicada a títulos, dados e leitura em português.</text><line x1="72" y1="216" x2="1368" y2="216" stroke="#D8D0C2" stroke-width="1"/><g id="A · REFERÊNCIA"><text x="72" y="270" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#5F6B65">A · REFERÊNCIA</text><text x="72" y="340" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="650" fill="#16211D">Estudar fora começa</text><text x="72" y="380.28" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="650" fill="#16211D">por perceber o teu</text><text x="72" y="420.56" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="650" fill="#16211D">ponto de partida.</text><text x="72" y="490" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#16211D">Newsreader + Manrope</text><text x="72" y="530" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">Dados demonstrativos. Confirma custos, prazos e</text><text x="72" y="548.85" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">requisitos na fonte oficial antes de avançar.</text><line x1="72" y1="600" x2="432" y2="600" stroke="#D8D0C2" stroke-width="1"/><text x="72" y="642" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" fill="#16211D">1 234 567 Kz  ·  08 AGO 2026</text><g id="Estado Comparar"><rect x="72" y="680" width="120" height="28" rx="999" fill="#FFFDFC" stroke="#D8D0C2"/><text x="132" y="699" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#16211D" text-anchor="middle">Comparar</text></g><text x="72" y="752" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Elegante, mas já associado à linguagem v0.1.</text></g><g id="B · DIREÇÃO"><text x="504" y="270" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#AD5132">B · DIREÇÃO</text><text x="504" y="340" font-family="Literata, Georgia, serif" font-size="38" font-weight="650" fill="#16211D">Estudar fora começa</text><text x="504" y="380.28" font-family="Literata, Georgia, serif" font-size="38" font-weight="650" fill="#16211D">por perceber o teu</text><text x="504" y="420.56" font-family="Literata, Georgia, serif" font-size="38" font-weight="650" fill="#16211D">ponto de partida.</text><text x="504" y="490" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#16211D">Literata + IBM Plex Sans</text><text x="504" y="530" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">Dados demonstrativos. Confirma custos, prazos e</text><text x="504" y="548.85" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">requisitos na fonte oficial antes de avançar.</text><line x1="504" y1="600" x2="864" y2="600" stroke="#D8D0C2" stroke-width="1"/><text x="504" y="642" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#16211D">1 234 567 Kz  ·  08 AGO 2026</text><g id="Estado Selecionada"><rect x="504" y="680" width="120" height="28" rx="999" fill="#173F34" stroke="#173F34"/><text x="564" y="699" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Selecionada</text></g><text x="504" y="752" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Mais documental, legível e institucional sem parecer burocrático.</text></g><g id="C · ALTERNATIVA"><text x="936" y="270" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#5F6B65">C · ALTERNATIVA</text><text x="936" y="340" font-family="Domine, Georgia, serif" font-size="38" font-weight="650" fill="#16211D">Estudar fora começa</text><text x="936" y="380.28" font-family="Domine, Georgia, serif" font-size="38" font-weight="650" fill="#16211D">por perceber o teu</text><text x="936" y="420.56" font-family="Domine, Georgia, serif" font-size="38" font-weight="650" fill="#16211D">ponto de partida.</text><text x="936" y="490" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="600" fill="#16211D">Domine + Archivo</text><text x="936" y="530" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">Dados demonstrativos. Confirma custos, prazos e</text><text x="936" y="548.85" font-family="Archivo, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">requisitos na fonte oficial antes de avançar.</text><line x1="936" y1="600" x2="1296" y2="600" stroke="#D8D0C2" stroke-width="1"/><text x="936" y="642" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="600" fill="#16211D">1 234 567 Kz  ·  08 AGO 2026</text><g id="Estado Comparar"><rect x="936" y="680" width="120" height="28" rx="999" fill="#FFFDFC" stroke="#D8D0C2"/><text x="996" y="699" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#16211D" text-anchor="middle">Comparar</text></g><text x="936" y="752" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Contemporâneo e firme, com menos nuance editorial.</text></g></svg>