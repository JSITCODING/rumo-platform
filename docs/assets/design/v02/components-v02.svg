<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1600" viewBox="0 0 1440 1600" role="img" aria-label="Rumo Components v0.2"><title>Rumo Components v0.2</title><desc>Rumo editorial documental v0.2</desc><rect x="0" y="0" width="1440" height="1600" rx="0" fill="#FFFDFC" stroke="none"/><text x="72" y="72" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#AD5132" letter-spacing="1">04 — COMPONENTS · v0.2</text><text x="72" y="132" font-family="Literata, Georgia, serif" font-size="42" font-weight="650" fill="#16211D">Primitivos próprios do Rumo</text><text x="72" y="174" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6B65">Estados reutilizáveis sem transformar cada secção num cartão.</text><line x1="72" y1="210" x2="1368" y2="210" stroke="#D8D0C2" stroke-width="1"/><g id="Nota Rumo"><text x="72" y="262" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#173F34">NOTA RUMO</text><g id="Nota Rumo"><rect x="72" y="300" width="420" height="8" rx="0" fill="#895F20" stroke="none"/><text x="72" y="327" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#895F20" letter-spacing="0.8">INCERTEZA</text><text x="72" y="347" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">O prazo ainda precisa de confirmação na fonte</text><text x="72" y="362.84" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">oficial da instituição.</text></g><g id="Nota Rumo"><rect x="540" y="300" width="420" height="8" rx="0" fill="#173F34" stroke="none"/><text x="540" y="327" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#173F34" letter-spacing="0.8">CONTEXTO</text><text x="540" y="347" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Esta comparação usa dados demonstrativos e</text><text x="540" y="362.84" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">não representa decisão de admissão.</text></g><g id="Nota Rumo"><rect x="1008" y="300" width="360" height="8" rx="0" fill="#AD5132" stroke="none"/><text x="1008" y="327" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#AD5132" letter-spacing="0.8">ATENÇÃO</text><text x="1008" y="347" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Não foi possível guardar. Tenta novamente.</text></g></g><g id="Faixa de fonte"><text x="72" y="490" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#173F34">FAIXA DE FONTE</text><g id="Faixa de fonte"><rect x="72" y="528" width="620" height="42" rx="0" fill="#F7F3EA" stroke="none"/><rect x="72" y="528" width="4" height="42" rx="0" fill="#895F20" stroke="none"/><text x="86" y="545" font-family="IBM Plex Mono, monospace" font-size="9" font-weight="600" fill="#895F20" letter-spacing="0.7">FONTE E CERTEZA</text><text x="86" y="561" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F6B65">Verificado em 08 ago 2026 · fonte oficial</text></g><g id="Faixa de fonte"><rect x="720" y="528" width="648" height="42" rx="0" fill="#F7F3EA" stroke="none"/><rect x="720" y="528" width="4" height="42" rx="0" fill="#895F20" stroke="none"/><text x="734" y="545" font-family="IBM Plex Mono, monospace" font-size="9" font-weight="600" fill="#895F20" letter-spacing="0.7">FONTE E CERTEZA</text><text x="734" y="561" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F6B65">Dado demonstrativo · por verificar</text></g></g><g id="Próximo passo"><text x="72" y="650" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#173F34">PRÓXIMO PASSO</text><rect x="72" y="688" width="4" height="210" rx="0" fill="#AD5132" stroke="none"/><text x="104" y="716" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#AD5132">PRÓXIMO PASSO · 01</text><text x="104" y="764" font-family="Literata, Georgia, serif" font-size="28" font-weight="650" fill="#16211D">Confirma os requisitos</text><text x="104" y="806" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">Abre a fonte oficial e compara os requisitos</text><text x="104" y="824.2" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">com os dados do teu perfil.</text><text x="104" y="868" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#173F34">Começar  →</text></g><g id="Controlos e estados"><text x="720" y="650" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" fill="#173F34">CONTROLOS E ESTADOS</text><g id="Acção Continuar"><rect x="720" y="688" width="220" height="48" rx="4" fill="#173F34" stroke="none"/><text x="830" y="718" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Continuar</text></g><g id="Acção A guardar…"><rect x="960" y="688" width="220" height="48" rx="4" fill="#D8D0C2" stroke="none"/><text x="1070" y="718" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#5F6B65" text-anchor="middle">A guardar…</text></g><g id="Estado Verificado"><rect x="720" y="770" width="110" height="28" rx="999" fill="#DCEBE5" stroke="#DCEBE5"/><text x="775" y="789" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#173F34" text-anchor="middle">Verificado</text></g><g id="Estado Por verificar"><rect x="846" y="770" width="120" height="28" rx="999" fill="#F2E7CB" stroke="#F2E7CB"/><text x="906" y="789" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#895F20" text-anchor="middle">Por verificar</text></g><g id="Estado Erro"><rect x="