<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="800" viewBox="0 0 360 800" role="img" aria-label="S05 Dashboard Mobile v0.2"><title>S05 Dashboard Mobile v0.2</title><desc>Rumo editorial documental v0.2</desc><rect x="0" y="0" width="360" height="800" rx="0" fill="#FFFDFC" stroke="none"/><g id="Rumo logo" transform="translate(20 24) scale(0.72)"><path d="M0 0 L12 7 L12 22 L0 15 Z" fill="#AD5132"/><path d="M0 0 L12 7 L24 0 L12 -7 Z" fill="#286150"/><path d="M12 7 L24 0 L24 15 L12 22 Z" fill="#173F34"/><text x="32" y="15" font-family="Literata, Georgia, serif" font-size="22" font-weight="700" fill="#16211D">rumo</text></g><text x="340" y="38" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="400" fill="#5F6B65" text-anchor="end" letter-spacing="1">S05 · INÍCIO</text><line x1="20" y1="62" x2="340" y2="62" stroke="#D8D0C2" stroke-width="1"/><text x="20" y="104" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B65">Bom dia, Ana.</text><text x="20" y="148" font-family="Literata, Georgia, serif" font-size="34" font-weight="650" fill="#16211D">Um próximo passo</text><text x="20" y="184.04" font-family="Literata, Georgia, serif" font-size="34" font-weight="650" fill="#16211D">de cada vez.</text>
  <g id="Próximo passo"><rect x="20" y="236" width="4" height="216" rx="0" fill="#AD5132" stroke="none"/><text x="44" y="258" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#AD5132">PRÓXIMO PASSO · 01</text><text x="44" y="300" font-family="Literata, Georgia, serif" font-size="25" font-weight="650" fill="#16211D">Encontra uma opção</text><text x="44" y="327.5" font-family="Literata, Georgia, serif" font-size="25" font-weight="650" fill="#16211D">que faça sentido</text><text x="44" y="370" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Compara requisitos e fontes antes de</text><text x="44" y="386.8" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">adicionares uma oportunidade ao plano.</text><text x="44" y="424" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#173F34">Explorar oportunidades  →</text></g>
  <g id="Resumo do plano"><line x1="20" y1="486" x2="340" y2="486" stroke="#D8D0C2" stroke-width="1"/><text x="20" y="519" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#173F34">O TEU PLANO</text><text x="320" y="519" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6B65" text-anchor="end">0 oportunidades</text><text x="20" y="554" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#16211D">Ainda não existe uma candidatura em curso.</text><text x="20" y="579" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6B65">Quando adicionares uma, os passos aparecem aqui.</text><line x1="20" y1="610" x2="340" y2="610" stroke="#D8D0C2" stroke-width="1"/></g><g id="Nota Rumo"><rect x="20" y="636" width="320" height="8" rx="0" fill="#895F20" stroke="none"/><text x="20" y="663" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#895F20" letter-spacing="0.8">PERFIL</text><text x="20" y="683" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Dois dados continuam por confirmar. Isto pode</text><text x="20" y="698.84" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">alterar a compatibilidade apresentada.</text></g><g id="Navegação"><rect x="0" y="744" width="360" height="56" fill="#FFFDFC"/><line x1="0" y1="744" x2="360" y2="744" stroke="#D8D0C2" stroke-width="1"/><circle cx="60" cy="762" r="3" fill="#173F34" stroke="none"/><text x="60" y="783" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10" font-weight="600" fill="#173F34" text-anchor="middle">Início</text><circle cx="180" cy="762" r="3" fill="#D8D0C2" stroke="none"/><text x="180" y="783" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F6B65" text-anchor="middle">Descobrir</text><circle cx="300" cy="762" r="3" fill="#D8D0C2" stroke="none"/><text x="300" y="783" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#5F6B65" text-anchor="middle">Plano</text></g></svg>