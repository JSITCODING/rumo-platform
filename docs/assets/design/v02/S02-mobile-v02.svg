<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="800" viewBox="0 0 360 800" role="img" aria-label="S02 Registo Mobile v0.2"><title>S02 Registo Mobile v0.2</title><desc>Rumo editorial documental v0.2</desc><rect x="0" y="0" width="360" height="800" rx="0" fill="#FFFDFC" stroke="none"/><g id="Rumo logo" transform="translate(20 24) scale(0.72)"><path d="M0 0 L12 7 L12 22 L0 15 Z" fill="#AD5132"/><path d="M0 0 L12 7 L24 0 L12 -7 Z" fill="#286150"/><path d="M12 7 L24 0 L24 15 L12 22 Z" fill="#173F34"/><text x="32" y="15" font-family="Literata, Georgia, serif" font-size="22" font-weight="700" fill="#16211D">rumo</text></g><text x="340" y="38" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="400" fill="#5F6B65" text-anchor="end" letter-spacing="1">S02 · CONTA</text><line x1="20" y1="62" x2="340" y2="62" stroke="#D8D0C2" stroke-width="1"/><text x="20" y="103" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#AD5132">01</text><text x="58" y="109" font-family="Literata, Georgia, serif" font-size="30" font-weight="650" fill="#16211D">Cria o teu acesso.</text><text x="58" y="143" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Guardamos apenas o necessário para retomares o processo.</text>
  <g id="Formulário"><text x="20" y="204" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#16211D">Como devemos chamar-te?</text><text x="20" y="234" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6B65">Ex.: Ana Manuel</text><line x1="20" y1="252" x2="340" y2="252" stroke="#D8D0C2" stroke-width="1"/><text x="20" y="296" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#16211D">O teu email</text><text x="20" y="326" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6B65">teuemail@exemplo.com</text><line x1="20" y1="344" x2="340" y2="344" stroke="#913B35" stroke-width="2"/><text x="20" y="388" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#16211D">Cria uma palavra-passe</text><text x="20" y="418" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#5F6B65">Mínimo de 8 caracteres</text><line x1="20" y1="436" x2="340" y2="436" stroke="#D8D0C2" stroke-width="1"/><text x="20" y="368" font-family="IBM Plex Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#913B35">Confirma se o endereço está correcto.</text></g>
  <g id="Consentimento"><rect x="20" y="489" width="18" height="18" rx="4" fill="#FFFDFC" stroke="#5F6B65"/><text x="50" y="501" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6B65">Aceito os termos e compreendo como os meus dados</text><text x="50" y="515.85" font-family="IBM Plex Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6B65">serão usados para orientar a candidatura.</text></g><g id="Acção Criar conta"><rect x="20" y="566" width="320" height="48" rx="4" fill="#173F34" stroke="none"/><text x="180" y="596" font-family="IBM Plex Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Criar conta</text></g><g id="Nota Rumo"><rect x="20" y="644" width="320" height="8" rx="0" fill="#173F34" stroke="none"/><text x="20" y="671" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#173F34" letter-spacing="0.8">PRIVACIDADE</text><text x="20" y="691" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">Não partilhamos o teu perfil com universidades</text><text x="20" y="706.84" font-family="IBM Plex Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F6B65">nesta fase demonstrativa.</text></g></svg>